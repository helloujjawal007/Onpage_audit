name: Keep Render Awake

on:
  schedule:
    # Runs every 12 minutes
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          echo "Sending keep-alive ping to Render..."
          curl -s -f https://onpage-audit.onrender.com/health || curl -s -f https://onpage-audit.onrender.com/
          echo "Keep-alive ping successful!"
